<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify student email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container py-5" style="max-width: 36rem">
        <h1 class="h3">Verify your student email</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="alert alert-{{ category }}" role="status">{{ message }}</div>{% endfor %}
        {% endwith %}
        <p>Confirm the email address used for your student registration. This link can be used once.</p>
        <form method="post" action="{{ url_for('registries.verify_student_email') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" id="verification-token" name="token" value="">
            <button class="btn btn-primary" type="submit">Verify email and activate account</button>
        </form>
        <p class="mt-3"><a href="{{ url_for('auth.login') }}">Return to sign in</a></p>
    </main>
    <script>document.getElementById('verification-token').value = window.location.hash.slice(1);</script>
</body>
</html>
