<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <section class="card login-card shadow-lg" aria-labelledby="reset-heading">
            <div class="card-body p-5">
                <h1 class="h3 text-center mb-3" id="reset-heading">Set a new password</h1>
                <p class="text-muted">Use at least 12 characters with at least three character types: lowercase, uppercase, number, or symbol.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}<div class="alert alert-{{ category }}" role="alert">{{ message }}</div>{% endfor %}
                {% endwith %}
                <form method="post" action="{{ url_for('auth.password_reset_consume') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="token" id="reset-token">
                    <label class="form-label" for="password">New password</label>
                    <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                    <label class="form-label" for="password_confirmation">Confirm new password</label>
                    <input class="form-control mb-3" id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                    <button class="btn btn-primary w-100" type="submit">Save new password</button>
                </form>
                <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
            </div>
        </section>
    </main>
    <script>
        const resetTokenKey = 'attendance-password-reset-token';
        const fragmentToken = window.location.hash.slice(1);
        if (fragmentToken) {
            sessionStorage.setItem(resetTokenKey, fragmentToken);
            history.replaceState(null, document.title, window.location.pathname);
        }
        document.getElementById('reset-token').value = sessionStorage.getItem(resetTokenKey) || '';
    </script>
</body>
</html>
