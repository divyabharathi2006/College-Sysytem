<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password updated</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <section class="card login-card shadow-lg p-5 text-center" aria-labelledby="complete-heading">
            <h1 class="h3" id="complete-heading">Password updated</h1>
            <p>Your password was changed and existing sessions were signed out.</p>
            <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Continue to login</a>
        </section>
    </main>
    <script>sessionStorage.removeItem('attendance-password-reset-token');</script>
</body>
</html>
